modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="eruruu_patch_logo.png"
authors="Celerbi"
credits="Made for Eruruu's Cult"
description='''
Compatibility and quality-of-life patch made for Eruruu's Cult OneBlock.
Adds renewable OneBlock-friendly resources, Farmer's Delight wild-crop access, Argentum seed recipes, Fertilizer,
Endless Charcoal, starter mushrooms, Nether cultures, extra mob loot, reinforced AFK pickaxes, Sugar Rush Haste foods, and JEI/EMI documentation.
This laboratory build also prototypes integrations with Stonecutter Sifting and Easy Farmer's Delight Compat.
'''

[[mixins]]
config="eruruu_patch.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="farmersdelight"
type="required"
versionRange="[1.3.2,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="argentum"
type="required"
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[19,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="emi"
type="optional"
versionRange="[1.1.24,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="jade"
type="optional"
versionRange="[15,)"
ordering="AFTER"
side="CLIENT"


[[dependencies.${mod_id}]]
modId="stonecutter_sifting"
type="required"
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="easy_villagers"
type="required"
reason="The Cutter laboratory stores and renders Easy Villagers VillagerItem data directly."
versionRange="[1.1.42,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="easyfarmersdelightcompat"
type="required"
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"
